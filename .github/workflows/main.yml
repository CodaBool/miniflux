name: main
on:
  schedule:
    - cron: "0 10 * * 0" # Run weekly
  push:
    branches:
      - main
permissions:
  contents: write # to push back to your repo
  packages: write # to push to GHCR (with your PAT)
jobs:
  docker-images:
    runs-on: ubuntu-latest
    steps:
      # https://github.com/marketplace/actions/checkout
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Add upstream and merge
        run: |
          echo "Merge hit conflicts. Resolving workflow conflicts generically."

          # Get all unmerged files in workflows
          conflicts=$(git diff --name-only --diff-filter=U -- .github/workflows)

          for f in $conflicts; do
            if [[ "$(basename "$f")" != "main.yml" ]]; then
              # Remove file (handles modify/delete conflicts correctly)
              git rm -f "$f" 2>/dev/null || true
            else
              # Keep our version of main.yml if conflicted
              git checkout --ours "$f" 2>/dev/null || true
              git add "$f"
            fi
          done

          # Clean up any leftover non-conflicted files (future-proofing)
          find .github/workflows -type f ! -name "main.yml" -print0 | xargs -0 -r git rm -f --ignore-unmatch

          # Stage directory to ensure index is clean
          git add .github/workflows 2>/dev/null || true

          # Check if any conflicts remain anywhere
          remaining=$(git diff --name-only --diff-filter=U)
          if [[ -n "$remaining" ]]; then
            echo "::error::Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi

          git commit -m "Resolve workflow merge conflicts by keeping local workflows"
      - name: Remove upstream .github folder except our workflow
        run: |
          # Remove upstream actions/etc if present
          if [ -d ".github" ]; then
            # Preserve your main workflow only
            mkdir -p .github-tmp/workflows
            if [ -f ".github/workflows/main.yml" ]; then
              cp .github/workflows/main.yml .github-tmp/workflows/
            fi

            rm -rf .github

            mkdir -p .github/workflows
            cp .github-tmp/workflows/main.yml .github/workflows/ 2>/dev/null || true
            rm -rf .github-tmp
          fi

          git add .github
          if ! git diff --cached --quiet; then
            git commit -m "Remove upstream .github folder (retain main.yml)"
          fi
      # https://github.com/marketplace/actions/docker-setup-docker
      - uses: docker/setup-docker-action@v5
      # login to github, build and push image
      - name: Build and push image
        run: |
          docker build -t ghcr.io/codabool/miniflux:latest --file ./packaging/docker/distroless/Dockerfile .
          echo ${{ secrets.GH_TOKEN }} | docker login ghcr.io -u codabool --password-stdin
          docker push ghcr.io/codabool/miniflux:latest
      - name: Push updated main branch
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if ! git diff --quiet origin/main..HEAD; then
            git push origin HEAD:main
          else
            echo "No new commits to push; main is up to date."
          fi
